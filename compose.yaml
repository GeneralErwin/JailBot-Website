services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jailbot
      POSTGRES_USER: jailbot
      POSTGRES_PASSWORD: jailbot-local-only
    ports:
      - "5432:5432"
    volumes:
      - jailbot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jailbot -d jailbot"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jailbot:jailbot-local-only@db:5432/jailbot
      APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  jailbot-postgres:
